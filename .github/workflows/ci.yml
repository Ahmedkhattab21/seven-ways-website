name: Seven Ways CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: seven_ways_testing
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: seven_ways_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, bcmath, curl, zip, fileinfo, pdo_mysql
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate

      - name: Validate and build
        run: |
          composer validate
          vendor/bin/pint --test
          npm run build

      - name: Database and seeder safety
        run: |
          php artisan migrate --force
          php artisan db:seed --class=ProductionReferenceSeeder --force
          php artisan db:seed --class=ProductionReferenceSeeder --force
          php artisan production:scan-migrations

      - name: Tests and assets
        run: |
          php artisan test
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan production:verify-assets
          php artisan optimize:clear
